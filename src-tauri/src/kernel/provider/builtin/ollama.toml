# Ollama — local LLM runtime, verbatim VMark REST adapter.
#
# ADR-002 substrate § provider v70: this builtin is catalogue data only.
# `rest_ollama` probes the configured daemon and selected model at runtime;
# the manifest never implies that Ollama is installed or role-bound.

id = "ollama"
label = "Ollama (local)"
kind = "rest_ollama"
endpoint = "http://localhost:11434"
# hermes3:8b remains the suggested model, not an installation claim.
# Runtime availability requires an exact matching tag from `/api/tags`; users
# may override `models[0]` in `~/.ctrl/providers/ollama.toml`.
models = [
  "hermes3:8b",
  "qwen2.5:7b",
  "qwen2.5:14b",
  "llama3.2",
  "llama3.1",
  "mistral",
]
description = "Local Ollama runtime — 0 cost, runs entirely on your machine. Default endpoint http://localhost:11434."
capabilities = ["text.chat"]

[auth]
source = "none"
